<body>

    <!-- メインコンテンツ -->
    <div class="container">
        <h1>2進数 → 10進数 変換練習</h1>
        <p>表示された2進数を10進数に変換しよう。</p>

        <div class="problem-area">
            <div id="binary-display">1010</div>
        </div>

        <div class="input-area">
            <input type="number" id="user-answer" placeholder="10進数" onkeypress="handleKeyPress(event)">
        </div>

        <div>
            <!-- IDを追加し、次の問題ボタンは初期状態で非表示に -->
            <button class="btn-submit" id="btn-submit" onclick="checkAnswer()">答え合わせ</button>
            <button class="btn-next" id="btn-next" onclick="generateProblem()" style="display: none;">次の問題</button>
        </div>

        <div id="result-message"></div>
        
        <div id="explanation" class="explanation"></div>
    </div>

    <!-- フッター -->
    <footer>
        © 2025-2026 131a5c6. All Rights Reserved.<br>
        Created with the support of AI (Gemini).
    </footer>

    <!-- スクリプト -->
    <script>
        let currentDecimal = 0;
        let currentBinary = "";

        function generateProblem() {
            currentDecimal = Math.floor(Math.random() * 255) + 1;
            currentBinary = currentDecimal.toString(2);
            
            document.getElementById('binary-display').innerText = currentBinary;
            document.getElementById('user-answer').value = '';
            document.getElementById('result-message').innerText = '';
            document.getElementById('result-message').className = '';
            document.getElementById('explanation').style.display = 'none';
            
            // ボタンの表示をリセット（答え合わせボタンを表示、次の問題ボタンを隠す）
            document.getElementById('btn-submit').style.display = 'inline-block';
            document.getElementById('btn-next').style.display = 'none';
            
            document.getElementById('user-answer').focus();
        }

        function handleKeyPress(event) {
            // エンターキーが押された時の処理
            if (event.key === 'Enter') {
                // まだ答え合わせをしていない場合のみ判定を実行
                if (document.getElementById('btn-submit').style.display !== 'none') {
                    checkAnswer();
                } else {
                    // 答え合わせ済みの場合は次の問題へ
                    generateProblem();
                }
            }
        }

        function checkAnswer() {
            const userInput = document.getElementById('user-answer').value;
            const resultMessage = document.getElementById('result-message');
            const explanation = document.getElementById('explanation');

            if (userInput === '') {
                resultMessage.innerText = '答えを入力してください。';
                resultMessage.className = 'incorrect';
                return; // 未入力の場合は処理を中断してボタンはそのまま
            }

            const userAnswer = parseInt(userInput, 10);

            if (userAnswer === currentDecimal) {
                resultMessage.innerText = '正解';
                resultMessage.className = 'correct';
            } else {
                resultMessage.innerText = '不正解';
                resultMessage.className = 'incorrect';
            }

            let expHtml = `<strong>【解説】</strong><br>`;
            expHtml += `元の2進数： <strong>${currentBinary}</strong><br>`;
            expHtml += `正解の10進数： <strong>${currentDecimal}</strong><br><br>`;
            
            expHtml += `<strong>計算式：</strong><br>`;
            let calculationParts = [];
            for (let i = 0; i < currentBinary.length; i++) {
                let bit = parseInt(currentBinary[i]);
                let power = currentBinary.length - 1 - i;
                if (bit === 1) {
                    calculationParts.push(`(1 × 2<sup>${power}</sup>)`);
                }
            }
            expHtml += calculationParts.join(" + ") + ` = ${currentDecimal}`;

            explanation.innerHTML = expHtml;
            explanation.style.display = 'block';

            // 答え合わせが完了したらボタンを切り替える
            document.getElementById('btn-submit').style.display = 'none';
            document.getElementById('btn-next').style.display = 'inline-block';
            
            // 次の問題ボタンにフォーカスを当てておく（エンターキーで次に行きやすくするため）
            document.getElementById('btn-next').focus();
        }

        window.onload = generateProblem;
    </script>
</body>
